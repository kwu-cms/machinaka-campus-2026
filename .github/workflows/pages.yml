name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "css/**"
      - "js/**"
      - "data/**"
      - "images/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync spreadsheet CSV into data/
        run: node scripts/sync-sheets.mjs

      - name: Generate config (local / bundled CSV)
        run: node scripts/generate-config.mjs local

      - name: Assemble public site for Pages
        env:
          SITE_ORIGIN: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: bash scripts/assemble-site.sh _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
